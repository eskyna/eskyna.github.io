name: Lighthouse CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.160.0"
          extended: true

      - name: Install image conversion tools (cwebp, avifenc)
        run: sudo apt-get update && sudo apt-get install -y webp libavif-bin

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci
