name: Deploy ESKYNA EStyle PWA

on:
  push:
    branches:
      - main
    paths:
      - static/estyleapp/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: config.js aus GitHub Secret erzeugen
        shell: bash
        run: |
          cat > static/estyleapp/config.js <<EOF_CONFIG
          // ESKYNA / EStyle PWA Konfiguration
          // Diese Datei wird beim Deploy aus GitHub Secrets erzeugt.
          // Diese Datei ist absichtlich sowohl im Browser als auch im Service Worker ladbar.
          (function initEskynaConfig(globalScope) {
            const config = {
              appBasePath: "/estyleapp/",
              pwaStartUrl: "/estyleapp/#welcome",
              apiEndpoint: "https://api.eskyna-style.workers.dev/v1/images",
              demoMode: false,
              uploadMode: "binary",
              contentType: "application/octet-stream",
              credentials: "same-origin",
              maxUploadWidth: 1600,
              jpegQuality: 0.88,
              timeoutMs: 60000,
              maxPhotos: 4,
              multiPhotoUploadMode: "multipart",

              push: {
                enabled: true,
                provider: "firebase-cloud-messaging",
                fcmVapidKey: "${{ secrets.FIREBASE_WEB_PUSH_VAPID_KEY }}",
                tokenStorage: "firestore",
                fcmTokensCollection: "fcmTokens",
                registerTokenEndpoint: "",
                unregisterTokenEndpoint: "",
                topic: "patchnotes",
                attachIdTokenToRegisterRequest: true,
              },

              auth: {
                enabled: true,
                required: true,
                provider: "firebase",
                firebaseSdkVersion: "12.15.0",
                allowedProviders: ["google"],
                signInMode: "popup",
                redirectAfterLogin: "create",
                attachIdTokenToAnalysisRequest: false,

                firebaseConfig: {
                  apiKey: "${{ secrets.FIREBASE_API_KEY }}",
                  authDomain: "eskyna-style.firebaseapp.com",
                  projectId: "eskyna-style",
                  storageBucket: "eskyna-style.firebasestorage.app",
                  messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
                  appId: "${{ secrets.FIREBASE_APP_ID }}",
                  measurementId: "${{ secrets.FIREBASE_MEASUREMENT_ID }}",
                },
              },
            };

            globalScope.ESKYNA_CONFIG = config;
          })(typeof self !== "undefined" ? self : window);
          EOF_CONFIG

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Zu GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
