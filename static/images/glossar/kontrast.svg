<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Kontrast Grafik</title>
  <desc id="desc">Helle und dunkle Flächen zeigen, wie Kontrast die Blickführung im Outfit verändert.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f6f0"/>
      <stop offset="1" stop-color="#e3d5c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#2c1e16" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="190" fill="#2c1e16" opacity="0.06"/>
  <circle cx="140" cy="680" r="210" fill="#c5a059" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="142" y="118" width="916" height="564" rx="36" fill="#fffaf4" opacity="0.94"/>
  </g>

  <g transform="translate(225 188)">
    <rect x="0" y="0" width="300" height="424" rx="26" fill="#2c1e16"/>
    <rect x="300" y="0" width="300" height="424" rx="26" fill="#f9f6f0"/>
    <path d="M300 0 V424" stroke="#c5a059" stroke-width="10" opacity="0.72"/>
    <circle cx="300" cy="150" r="92" fill="#fffaf4"/>
    <path d="M300 90 C264 122 252 180 270 220 C282 246 298 260 300 264 C302 260 318 246 330 220 C348 180 336 122 300 90Z" fill="#d3b49d"/>
    <path d="M262 302 C286 326 314 326 338 302" fill="none" stroke="#2c1e16" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g transform="translate(836 188)">
    <rect x="0" y="0" width="105" height="424" rx="18" fill="#2c1e16"/>
    <rect x="0" y="108" width="105" height="105" rx="18" fill="#8b5e34"/>
    <rect x="0" y="215" width="105" height="105" rx="18" fill="#c5a059"/>
    <rect x="0" y="322" width="105" height="102" rx="18" fill="#f9f6f0" stroke="#d8c0aa" stroke-width="2"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" fill="#2c1e16">
    <text x="232" y="646" font-size="28" opacity="0.78">hoher Kontrast</text>
    <text x="814" y="646" font-size="28" opacity="0.78">Tonwerte</text>
  </g>
</svg>
