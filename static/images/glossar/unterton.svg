<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Unterton Grafik</title>
  <desc id="desc">Warme, neutrale und kühle Farbbahnen zeigen den Unterton einer Farbe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f6f0"/>
      <stop offset="1" stop-color="#e3d5c8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c27a"/>
      <stop offset="1" stop-color="#b66a3c"/>
    </linearGradient>
    <linearGradient id="neutral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfd3c4"/>
      <stop offset="1" stop-color="#9d8975"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7d0d8"/>
      <stop offset="1" stop-color="#4f6f80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#2c1e16" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="102" cy="110" r="160" fill="#c5a059" opacity="0.12"/>
  <circle cx="1060" cy="690" r="210" fill="#4f6f80" opacity="0.1"/>

  <g filter="url(#shadow)">
    <rect x="176" y="122" width="848" height="556" rx="36" fill="#fffaf4" opacity="0.92"/>
  </g>

  <g transform="translate(250 184)">
    <path d="M0 0 H190 V428 C138 394 62 458 0 418Z" fill="url(#warm)"/>
    <path d="M254 0 H444 V428 C388 460 318 394 254 426Z" fill="url(#neutral)"/>
    <path d="M508 0 H698 V428 C644 396 574 456 508 420Z" fill="url(#cool)"/>
    <path d="M0 0 H190" stroke="#fffaf4" stroke-width="10" opacity="0.6"/>
    <path d="M254 0 H444" stroke="#fffaf4" stroke-width="10" opacity="0.6"/>
    <path d="M508 0 H698" stroke="#fffaf4" stroke-width="10" opacity="0.6"/>
  </g>

  <g transform="translate(520 250)">
    <circle cx="80" cy="80" r="72" fill="#fffaf4" opacity="0.8"/>
    <path d="M80 36 C54 58 48 94 58 124 C66 148 78 158 80 162 C82 158 94 148 102 124 C112 94 106 58 80 36Z" fill="#d8b397" opacity="0.72"/>
    <path d="M56 104 C68 116 92 116 104 104" fill="none" stroke="#2c1e16" stroke-width="5" stroke-linecap="round" opacity="0.46"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" text-anchor="middle" fill="#2c1e16">
    <text x="345" y="650" font-size="28" opacity="0.82">warm</text>
    <text x="600" y="650" font-size="28" opacity="0.82">neutral</text>
    <text x="854" y="650" font-size="28" opacity="0.82">kühl</text>
  </g>
</svg>
