    <rect x="160" y="122" width="880" height="556" rx="36" fill="#fffaf4" opacity="0.94"/>
  </g>

  <g transform="translate(240 190)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2c1e16" stroke-width="12" opacity="0.82">
      <path d="M70 0 C48 34 44 104 54 180 L38 420 H102 L86 180 C96 104 92 34 70 0Z"/>
      <path d="M230 0 C188 70 188 166 214 226 L176 420 H284 L246 226 C272 166 272 70 230 0Z"/>
      <path d="M390 0 C348 56 350 126 374 178 L318 420 H462 L406 178 C430 126 432 56 390 0Z"/>
      <path d="M550 0 C496 54 486 156 520 230 L482 420 H618 L580 230 C614 156 604 54 550 0Z"/>
      <path d="M710 0 C650 44 640 122 666 198 L620 420 H800 L754 198 C780 122 770 44 710 0Z"/>
    </g>
    <g stroke="#c5a059" stroke-width="6" opacity="0.74">
      <path d="M70 40 V390"/>
      <path d="M176 188 H284"/>
      <path d="M318 420 H462"/>
      <path d="M482 104 H618"/>
      <path d="M620 300 H800"/>
    </g>
  </g>

  <g font-family="Montserrat, Arial, sans-serif" fill="#2c1e16" text-anchor="middle" opacity="0.78">
    <text x="310" y="650" font-size="24">gerade</text>
    <text x="470" y="650" font-size="24">tailliert</text>
    <text x="630" y="650" font-size="24">A-Linie</text>
    <text x="790" y="650" font-size="24">Volumen</text>
