<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Silhouette Grafik</title>
  <desc id="desc">Mehrere klare Outfit-Linien zeigen gerade, taillierte und weite Silhouetten.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f6f0"/>
      <stop offset="1" stop-color="#e3d5c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="23" flood-color="#2c1e16" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1020" cy="150" r="180" fill="#c5a059" opacity="0.12"/>
  <circle cx="165" cy="690" r="210" fill="#8b5e34" opacity="0.08"/>

