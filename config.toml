baseURL = "https://eskyna.com/"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
disableHugoGeneratorInject = true
cleanDestinationDir = true
[minify]
  minifyOutput = true
title = "ESKYNA | Style & Image Coaching"

[languages]
  [languages.de]
    title = "ESKYNA | Style & Image Coaching"
    locale = "de-DE"
    label = "Deutsch"
    weight = 1
    contentDir = "content/de"
    [languages.de.params]
      author = "Natalia Kleemann"
      description = "Persönliches Style- und Image-Coaching Vor-Ort und Online. Entdecke deinen individuellen Stil und tritt sichtbar und authentisch auf. ESKYNA begleitet dich zu mehr Stilsicherheit und Selbstvertrauen."
  
  [languages.rus]
    title = "ESKYNA | Имидж-коучинг"
    locale = "ru-RU"
    label = "Русский"
    weight = 2
    contentDir = "content/ru"
    [languages.rus.params]
      author = "Наталия Клеманн"
      description = "Персональный имидж- и стиль-коучинг в Ганновере и онлайн. Развивайте свой стиль, уверенность и аутентичность с методом ESKYNA. Трансформируйте образ и становитесь заметным, стильным и уверенным профессионалом."

[params]
  author = "Natalia Kleemann"
  description = "Persönliches Style- und Image-Coaching Vor-Ort und Online. Entdecke deinen individuellen Stil und tritt sichtbar und authentisch auf. ESKYNA begleitet dich zu mehr Stilsicherheit und Selbstvertrauen."
  keywords = "Styleberatung, Imageberatung, Personal Styling, Farbberatung, Hannover, Online Coaching"
  contact_endpoint = "https://contact-api.eskyna-style.workers.dev"
  contact_fallback_email = "natalia@eskyna.com"
  turnstile_site_key = "0x4AAAAAADZwJxWSmKaRT7a5"
  [params.preview_banner]
    enabled = false
    label = "Preview"
    version = ""
    last_updated = ""
    commits = ""
    links_checked = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
