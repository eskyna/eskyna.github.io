[build]
  publish = "public"
  command = "hugo --minify"

[[redirects]]
  from = "/ru"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ru/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ru/*"
  to = "/rus/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data:;
      connect-src 'self';
      object-src 'none';
      base-uri 'self';
      frame-src 'none';
      frame-ancestors 'none';
      form-action 'self';
      upgrade-insecure-requests;
    """

[[headers]]
  for = "/max/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://unpkg.com;
      style-src 'self' 'unsafe-inline' https://unpkg.com;
      font-src 'self';
      img-src 'self' data: https://tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org;
      connect-src 'self' https://tile.openstreetmap.org https://unpkg.com;
      object-src 'none';
      base-uri 'self';
      frame-src 'none';
      frame-ancestors 'none';
      form-action 'self';
      upgrade-insecure-requests;
    """
